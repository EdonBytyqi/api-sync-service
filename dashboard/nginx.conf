server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # Keep redirects relative. Otherwise nginx turns "/api/sync/runs/7" into
  # "http://localhost/api/…" with its container port (80), not the host port.
  absolute_redirect off;

  # API on the same origin, no CORS (spec 004, AK-6.1). The trailing slash in
  # proxy_pass strips /api: /api/sync/runs -> http://service:3000/sync/runs.
  location /api/ {
    proxy_pass http://service:3000/;
    # Location: /sync/runs/7 from the service becomes /api/sync/runs/7.
    proxy_redirect / /api/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Unknown paths serve the app (AK-2.3).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
